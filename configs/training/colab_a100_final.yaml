training:
  # Corrida FINAL en A100 (Swin-UNETR y Attention U-Net a convergencia).
  # Mismo protocolo efectivo que la ablacion local (batch 1, samples_per_case 2,
  # patch 128, 15000 pasos, cosine LR) para que la comparativa de arquitecturas
  # sea justa. cache_mode none: el dataset se copia a /content (disco local).
  seed: 20260526
  device: cuda
  patch_size: [128, 128, 128]
  divisible_k: 16
  sliding_window_roi_size: [128, 128, 128]
  sliding_window_batch_size: 2
  sliding_window_overlap: 0.5
  prediction_threshold: 0.5
  samples_per_case: 2
  positive_crop_ratio: 1.0
  negative_crop_ratio: 1.0
  batch_size: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  cache_mode: none
  amp: true
  cudnn_benchmark: true
  max_epochs: 60
  max_steps: 15000
  validation_batches: 8
  validation_interval: 1
  log_every_steps: 25
  learning_rate: 0.0001
  weight_decay: 0.00001
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  lr_min_factor: 0.01
