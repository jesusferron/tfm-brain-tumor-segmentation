training:
  # Perfil local M4 Pro a resolucion plena (128^3), identico al protocolo de
  # Colab (colab_pro.yaml) salvo en device/AMP/batch. Permite entrenar en local
  # los 4 modelos pequenos (residual baseline + 2 ablaciones de fusion +
  # attention) con resultados comparables al hardware cloud. swin_unetr queda
  # excluido en local a 128^3 (fallback de MPS lo lleva a ~124 s/paso).
  # Justificacion del cambio 96^3 -> 128^3 registrada en docs/vitacora/README.md.
  seed: 20260526
  device: mps
  patch_size: [128, 128, 128]
  divisible_k: 16
  sliding_window_roi_size: [128, 128, 128]
  sliding_window_batch_size: 1
  sliding_window_overlap: 0.25
  prediction_threshold: 0.5
  samples_per_case: 2
  positive_crop_ratio: 1.0
  negative_crop_ratio: 1.0
  batch_size: 1
  num_workers: 6
  pin_memory: false
  persistent_workers: true
  prefetch_factor: 2
  amp: false
  cudnn_benchmark: false
  max_epochs: 30
  validation_batches: 2
  validation_interval: 5
  log_every_steps: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
