training:
  # Variante "gate-stab" de mac_m4_pro_128_5k.yaml para la exploracion del pilar 3
  # (adaptive_gating). Identica salvo los knobs de fusion, que estabilizan el
  # entrenamiento de la compuerta (ver docs/adaptive-gating-exploration.md):
  #   - fusion_lr 2e-5 (5x menor que el lr base): la compuerta se mueve mas despacio
  #     que el U-Net, evitando la regresion tardia observada en la epoca 5.
  #   - fusion_warmup_steps 500: la compuerta entra desde identidad, sin desestabilizar
  #     las features del U-Net al principio.
  #   - fusion_entropy_weight 0.01: penaliza el colapso de la softmax (mantiene la
  #     compuerta informativa; regularizacion suave).
  # El resto es identico a la corrida de 5000 pasos para que sea comparable.
  seed: 20260526
  device: mps
  patch_size: [128, 128, 128]
  divisible_k: 16
  sliding_window_roi_size: [128, 128, 128]
  sliding_window_batch_size: 1
  sliding_window_overlap: 0.25
  prediction_threshold: 0.5
  samples_per_case: 2
  positive_crop_ratio: 1.0
  negative_crop_ratio: 1.0
  batch_size: 1
  num_workers: 6
  pin_memory: false
  persistent_workers: true
  prefetch_factor: 2
  amp: false
  cudnn_benchmark: false
  max_epochs: 30
  max_steps: 5000
  validation_batches: 8
  validation_interval: 1
  log_every_steps: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
  # Gate-specific knobs (solo aplican si el modelo usa fusion: adaptive_gating).
  fusion_lr: 0.00002
  fusion_warmup_steps: 500
  fusion_entropy_weight: 0.01
