training:
  seed: 20260526
  device: cuda
  patch_size: [128, 128, 128]
  divisible_k: 16
  sliding_window_roi_size: [128, 128, 128]
  sliding_window_batch_size: 2
  sliding_window_overlap: 0.5
  prediction_threshold: 0.5
  samples_per_case: 4
  positive_crop_ratio: 1.0
  negative_crop_ratio: 1.0
  batch_size: 2
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  # I/O: cache the deterministic prefix (load + normalize + pad) to fast local
  # disk so that after the first epoch the NIfTI reads bypass Google Drive.
  # Requires the dataset copied to the runtime and cache_dir on local disk
  # (/content), NOT on Drive. See docs/colab-pro-baseline-residual-unet.md.
  cache_mode: persistent
  cache_dir: /content/tfm_cache/colab_pro
  amp: true
  cudnn_benchmark: true
  max_epochs: 30
  validation_batches: 4
  validation_interval: 5
  log_every_steps: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
