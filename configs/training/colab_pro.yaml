training:
  seed: 20260526
  device: cuda
  patch_size: [128, 128, 128]
  divisible_k: 16
  sliding_window_roi_size: [128, 128, 128]
  sliding_window_batch_size: 2
  sliding_window_overlap: 0.5
  prediction_threshold: 0.5
  samples_per_case: 4
  positive_crop_ratio: 1.0
  negative_crop_ratio: 1.0
  batch_size: 2
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  # I/O: copy the dataset to the runtime's LOCAL disk (/content) and read from
  # there. Local SSD reads already drive data_wait ~0, so no cache is used:
  # caching the full preprocessed split (~150 MB/case x ~1378 cases ~= 200 GB)
  # overflows Colab's ~235 GB disk. See docs/colab-pro-baseline-residual-unet.md
  # section 7c. (For a small subset, cache_mode: memory with cache_num is an
  # option, but it is unnecessary once the data are on local disk.)
  cache_mode: none
  amp: true
  cudnn_benchmark: true
  max_epochs: 30
  validation_batches: 4
  validation_interval: 5
  log_every_steps: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
