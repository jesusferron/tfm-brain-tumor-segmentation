training:
  # Corrida FINAL a convergencia (M4 Pro, MPS, 128^3) para los modelos pequenos
  # (ablacion de fusion + attention). Anade cosine LR + warmup respecto a la
  # config de 5000 pasos. El presupuesto de pasos (max_steps) se fija tras la
  # sonda de convergencia y se pasa por CLI; aqui se deja un techo alto.
  # Justificacion y sonda en docs/vitacora/README.md.
  seed: 20260526
  device: mps
  patch_size: [128, 128, 128]
  divisible_k: 16
  sliding_window_roi_size: [128, 128, 128]
  sliding_window_batch_size: 1
  sliding_window_overlap: 0.25
  prediction_threshold: 0.5
  samples_per_case: 2
  positive_crop_ratio: 1.0
  negative_crop_ratio: 1.0
  batch_size: 1
  num_workers: 6
  pin_memory: false
  persistent_workers: true
  prefetch_factor: 2
  amp: false
  cudnn_benchmark: false
  max_epochs: 60
  max_steps: 25000
  validation_batches: 8
  validation_interval: 1
  log_every_steps: 25
  learning_rate: 0.0001
  weight_decay: 0.00001
  # Cosine LR con warmup (~1 epoca) hasta 1% del lr base.
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  lr_min_factor: 0.01
